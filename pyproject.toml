[project]
name = "sampling-zoo"
version = "0.1.1"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
description = "Sampling strategies for large-scale datasets"
authors = [
    { name = "Sampling-Zoo contributors" }
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.62.0",
    "imbalanced-learn>=0.8.0",
    "iterative-stratification>=0.1.9",
    "hdbscan>=0.8.29",
]

[project.optional-dependencies]
tabpfn = [
    "tabpfn>=6.1.0",
]
